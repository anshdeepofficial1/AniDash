name: Release Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows"
        required: false
        default: true
        type: boolean
      build_linux:
        description: "Build Linux"
        required: false
        default: true
        type: boolean
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_macos:
        description: "Build macOS DMG"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/android_release_request"

permissions:
  contents: write

jobs:
  build-android:
    if: github.event_name == 'push' || github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.18.1"
      - name: Configure Android Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.18.1" >> android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> android/local.properties

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          if [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::ANDROID_STORE_PASSWORD is missing."
            exit 1
          fi

          SECRET=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | sed -E 's#^data:[^,]*;base64,##' | tr -d '\r\n ')
          printf '%s' "$SECRET" | base64 --decode > /tmp/anidash-keystore-first 2>/dev/null || true

          validate_store() {
            local file="$1"
            [ -s "$file" ] &&
            keytool -list -keystore "$file" -storepass "$ANDROID_STORE_PASSWORD" >/dev/null 2>&1
          }

          if validate_store /tmp/anidash-keystore-first; then
            cp /tmp/anidash-keystore-first android/app/upload-keystore.jks
            echo "Android keystore validated after normal Base64 decode."
          else
            tr -d '\r\n ' < /tmp/anidash-keystore-first | base64 --decode > /tmp/anidash-keystore-second 2>/dev/null || true
            if validate_store /tmp/anidash-keystore-second; then
              cp /tmp/anidash-keystore-second android/app/upload-keystore.jks
              echo "Android keystore validated after double Base64 decode."
            else
              echo "::error::ANDROID_KEYSTORE_BASE64 or ANDROID_STORE_PASSWORD is invalid."
              exit 1
            fi
          fi

          RESOLVED_ALIAS="$ANDROID_KEY_ALIAS"
          if [ -n "$RESOLVED_ALIAS" ] && ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$RESOLVED_ALIAS" >/dev/null 2>&1; then
            RESOLVED_ALIAS=""
          fi

          if [ -z "$RESOLVED_ALIAS" ]; then
            RESOLVED_ALIAS=$(keytool -list -v               -keystore android/app/upload-keystore.jks               -storepass "$ANDROID_STORE_PASSWORD" 2>/dev/null |
              awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')
          fi

          if [ -z "$RESOLVED_ALIAS" ]; then
            echo "::error::No PrivateKeyEntry alias could be found in the configured keystore."
            exit 1
          fi

          RESOLVED_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_STORE_PASSWORD}"

          mkdir -p /tmp/anidash-signcheck
          printf 'AniDash signing check' > /tmp/anidash-signcheck/payload.txt
          (cd /tmp/anidash-signcheck && jar cf check.jar payload.txt)
          if ! jarsigner             -keystore android/app/upload-keystore.jks             -storepass "$ANDROID_STORE_PASSWORD"             -keypass "$RESOLVED_KEY_PASSWORD"             /tmp/anidash-signcheck/check.jar             "$RESOLVED_ALIAS" >/dev/null 2>&1; then
            echo "::error::The configured private-key password is missing or invalid."
            exit 1
          fi

          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$RESOLVED_KEY_PASSWORD
          keyAlias=$RESOLVED_ALIAS
          storeFile=upload-keystore.jks
          EOF
          rm -rf /tmp/anidash-keystore-first /tmp/anidash-keystore-second /tmp/anidash-signcheck
          echo "Android release signing key validated successfully."

      - name: Configure App API Keys
        run: |
          cat <<EOF > keys.json
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID || 'dafce95c66734efefa19650c84178416' }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "API_URL": "${{ secrets.API_URL }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
            "ADMIN_ANILIST_ID": "8013267",
            "ANIDASH_ADMIN_API_URL": "${{ secrets.ANIDASH_ADMIN_API_URL }}"
          }
          EOF

      - run: flutter pub get
      - name: Run playback regression tests
        run: flutter test test/unit/stream_headers_test.dart
      - name: Build signed universal APK
        run: |
          flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define-from-file=keys.json
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/AniDash-v${VERSION}-Universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev webkit2gtk-4.1 libwpewebkit-1.0-dev libsecret-1-dev libasound2-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
      - name: Configure Env
        run:  |
          cat <<EOF > keys.json
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID || 'dafce95c66734efefa19650c84178416' }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "API_URL": "${{ secrets.API_URL }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}"
          }
          EOF
      - run: flutter pub get
      - run: flutter build linux --release --obfuscate --split-debug-info=build/linux/debug-info --dart-define-from-file=keys.json
      - run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../ShonenX-Linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: ShonenX-Linux.zip

  build-windows:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true'
    # Flutter 3.35 detects Visual Studio 2022; the newer windows-latest image
    # exposes VS 2026 and makes CMake incorrectly fall back to VS 2019.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - run: git config --system core.longpaths true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
      - name: Configure Env
        shell: bash
        run:  |
          cat <<EOF > keys.json
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID || 'dafce95c66734efefa19650c84178416' }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "API_URL": "${{ secrets.API_URL }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}"
          }
          EOF
      - run: flutter pub get
      - run: flutter build windows --release --obfuscate --split-debug-info=build/windows/debug-info --dart-define-from-file=keys.json
      - name: Generate Inno Script
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          $version = ([regex]::Match($pubspec, 'version:\s*([^\s+]+)')).Groups[1].Value
          $appId = ([regex]::Match($pubspec, 'id:\s*([^\s\n\r]+)')).Groups[1].Value
          $publisher = ([regex]::Match($pubspec, 'publisher:\s*([^\n\r]+)')).Groups[1].Value.Trim()
          $appName = ([regex]::Match($pubspec, 'name:\s*([^\n\r]+)', [System.Text.RegularExpressions.RegexOptions]::RightToLeft)).Groups[1].Value.Trim()
          $iss = @"
          [Setup]
          AppId={{$appId}}
          AppName=$appName
          AppVersion=$version
          AppPublisher=$publisher
          DefaultDirName={autopf}\$appName
          DefaultGroupName=$appName
          OutputDir=build\windows\x64\installer
          OutputBaseFilename=$appName-v$version-Setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "build\windows\x64\runner\release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\$appName"; Filename: "{app}\AniDash.exe"
          Name: "{autodesktop}\$appName"; Filename: "{app}\AniDash.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\AniDash.exe"; Description: "{cm:LaunchProgram,$appName}"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -FilePath installer.iss -Encoding utf8
      - name: Compile Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Create Portable Zip
        run: Compress-Archive -Path build\windows\x64\runner\release\* -DestinationPath AniDash-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            build/windows/x64/installer/*.exe
            AniDash-Windows-Portable.zip

  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
      - name: Install DMG Packaging Tools
        run: brew install create-dmg || true
      - name: Configure Env
        run: |
          cat <<EOF > keys.json
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID || 'dafce95c66734efefa19650c84178416' }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "API_URL": "${{ secrets.API_URL }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}"
          }
          EOF
      - run: flutter pub get
      - name: Build macOS App
        run: flutter build macos --release --no-tree-shake-icons --dart-define-from-file=keys.json
      - name: Create DMG Installer
        run: |
          chmod +x scripts/build_macos_dmg.sh
          ./scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/installer/*.dmg

  publish-release:
    needs: [build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: >
      always() &&
      (needs.build-android.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-windows.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve Release Metadata
        id: release_meta
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          TAG="v$VERSION"
          NOTES_FILE="release_notes.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: AniDash ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_meta.outputs.notes_file }}
          make_latest: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

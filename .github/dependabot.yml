version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(security)"

  # Maintain Dart / Flutter dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Pinned / incompatible with current Flutter 3.35 toolchain (Dart SDK 3.9.2)
      - dependency-name: "cupertino_icons"
        versions: [">= 2.0.0"]
      - dependency-name: "url_launcher"
        versions: [">= 6.3.3"]
      - dependency-name: "wakelock_plus"
        versions: [">= 1.5.0"]
      - dependency-name: "intl"
        versions: [">= 0.20.3"]

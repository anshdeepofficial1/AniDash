<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AniDash">
  <meta name="application-name" content="AniDash">
  <meta name="description" content="Discover your next anime, explore every episode and watch with AniDash.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://anidashweb.vercel.app/watch">
  <link rel="icon" type="image/png" sizes="32x32" href="/watch/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/watch/assets/apple-touch-icon.png">
  <link rel="manifest" href="/watch/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>AniDash — Anime, without the noise</title>
  <link rel="stylesheet" href="/watch/styles.css">
  <script defer src="/watch/vendor/hls-1.6.13.min.js"></script>
  <script defer src="/watch/app.js"></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="AniDash home">
      <span class="brand-mark"><span></span><span></span><span></span></span>
      <span class="brand-name">ani<span>dash</span></span>
    </a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#explore" data-nav="explore">Explore</a>
      <a href="#schedule" data-nav="schedule">Schedule</a>
    </nav>
    <form id="globalSearchForm" class="global-search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
      <input id="globalSearch" type="search" autocomplete="off" placeholder="Search anime, genres, seasons..." aria-label="Search anime">
      <kbd>ENTER</kbd>
    </form>
    <div class="top-actions">
      <button class="icon-btn" id="watchlistShortcut" aria-label="Open watchlist" title="Watchlist">
        <svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-3.7-6 3.7z"/></svg>
      </button>
      <button class="profile-chip" id="profileShortcut" aria-label="Your AniDash library"><span class="profile-dot">A</span><span>My library</span></button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-screen"><span class="loader-mark"></span><b>Getting your anime ready</b><small>Loading AniDash</small></section>
  </main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#home" data-nav="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H14v-6h-4v6H3z"/></svg><span>Home</span></a>
    <a href="#explore" data-nav="explore"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Explore</span></a>
    <a href="#watchlist" data-nav="watchlist"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-3.7-6 3.7z"/></svg><span>Library</span></a>
    <a href="#history" data-nav="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2M4 5l2 .5L6 8"/></svg><span>History</span></a>
  </nav>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>
</body>
</html>

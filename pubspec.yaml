name: ani_dash

description: >
  🚀 AniDash is a blazing-fast, modern, and user-friendly anime streaming app built with Flutter.
  Stream your favorite anime, keep track of your watch progress, and explore trending shows —
  all in one place. Built with ❤️ by anshdeepofficial1.

publish_to: "none"

version: 1.19.3+127

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  awesome_snackbar_content: any
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  collection: ^1.19.1
  # 7.1+ requires Xcode 26; 6.1.5 keeps identical connectivity behavior while
  # supporting the stable macOS runner used for unsigned IPA builds.
  connectivity_plus: 6.1.5
  cupertino_icons: ^1.0.8

  commentum_client:
    git:
      url: https://github.com/commentum/commentum_flutter.git
      ref: b06012da07b50260ba512edf8878184712c21361
      path: ./

  dartotsu_extension_bridge:
    path: packages/dartotsu_extension_bridge

  # 12.4 calls an iOS 26-only NSProcessInfo selector; 12.3 includes current
  # iPhone/iPad identifiers and compiles on the stable Xcode runner.
  device_info_plus: 12.3.0
  dynamic_color: 1.7.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  file_picker: ^11.0.3
  flex_color_picker: any
  flex_color_scheme: 8.3.0

  flutter:
    sdk: flutter

  flutter_highlight: ^0.7.0
  flutter_local_notifications: any
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.0.1

  flutter_secure_storage: ^10.3.4
  flutter_volume_controller: ^2.0.1
  flutter_web_auth_2: ^5.1.0
  local_auth: ^2.3.0

  go_router: any
  google_fonts: ^6.3.2
  graphql: ^5.2.4
  highlight: ^0.7.0
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.1.0
  html: ^0.15.7
  http: ^1.4.0
  http_interceptor: ^2.0.0
  iconsax: ^0.0.8
  image: ^4.5.3
  install_plugin: ^2.1.0
  intl: ^0.20.2
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0

  js_packer: ^0.0.5
  logger: ^2.5.0

  media_kit: any
  media_kit_video: any
  media_kit_libs_video: any

  package_info_plus: ^9.0.1
  onesignal_flutter: ^5.7.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  pseudom: ^1.0.1
  rename: ^3.0.2
  riverpod_annotation: ^3.0.1
  screen_brightness: ^2.1.11
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  shared_preferences: any
  url_launcher: ^6.3.1
  window_manager: ^0.5.2
  workmanager: any
  xpath_selector_html_parser: ^3.0.1
  get: ^4.7.2
  timeago: ^3.7.1
  timezone: ^0.10.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dependency_overrides:
  collection: ^1.19.1
  # 2.1.3+ uses the newer Flutter iOS scene-delegate API and does not compile
  # with the Flutter 3.35 toolchain used by AniDash releases.
  screen_brightness_ios: 2.1.2

dev_dependencies:
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.8.1
  riverpod_generator: ^3.0.0
  isar_community_generator: ^3.3.0
  shared_preferences_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/ai_assistants/
    - assets/icons/anidash_logo.png
    - assets/icons/anidash_logo_dark.png
    - assets/icons/anidash_logo_light.png
    - assets/sounds/
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/anidash_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/anidash_logo_light.png"
  windows:
    generate: true
    image_path: "assets/icons/anidash_logo.png"
  macos:
    generate: true
    image_path: "assets/icons/anidash_logo.png"

inno_bundle:
  id: 0516d984-72bf-47d4-bfbc-b2b8fd563479
  publisher: Anshdeep Singh
  name: AniDash
  url: https://github.com/anshdeepofficial1/AniDash
  support_url: https://github.com/anshdeepofficial1/AniDash/issues
  updates_url: https://github.com/anshdeepofficial1/AniDash/releases
  languages:
    - english
  admin: false

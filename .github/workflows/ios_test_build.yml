name: iOS Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned iOS test package
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry AniDash-iOS-unsigned-v1.17.0.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AniDash-iOS-unsigned-v1.17.0
          path: build/ios/ipa/AniDash-iOS-unsigned-v1.17.0.ipa
          if-no-files-found: error
